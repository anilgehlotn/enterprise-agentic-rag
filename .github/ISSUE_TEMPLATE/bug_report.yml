name: Bug report
description: Something in the service behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys, tokens or private documents —
        not even expired ones. For a security problem, use private reporting instead
        (see [SECURITY.md](https://github.com/anilgehlotn/enterprise-agentic-rag/blob/main/SECURITY.md)).

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence of steps that shows the problem.
      placeholder: |
        1. Start the API with `uvicorn app.main:app --port 8000`
        2. POST /query with {"q": "..."}
        3. The response is ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - API (app/main.py, endpoints, streaming)
        - Agent (planner, retriever, grader, rewriter, responder, verifier)
        - Retrieval (Qdrant, BM25, RRF, FlashRank, citations)
        - Ingestion and chunking
        - Guardrails
        - LLM gateway
        - Conversation memory / checkpointer
        - Analytics and feedback
        - MCP server
        - Streamlit UI
        - Evaluations and benchmarks
        - CI, Docker or deployment
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The traceback or the response body. Remove keys and document text first.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How you are running it, and anything non-default.
      placeholder: |
        - Python version: 3.11.9
        - How it runs: local uvicorn / Docker / Cloud Run
        - Non-default settings: RETRIEVAL_MODE=dense, CHECKPOINTER=memory
        - Commit or branch: main @ abc1234
    validations:
      required: true

  - type: textarea
    id: checks
    attributes:
      label: Output of the checks
      description: |
        Optional but useful: `ruff check .`, `ruff format --check .` and
        `python -m pytest tests -q`. These need no API keys.
      render: text

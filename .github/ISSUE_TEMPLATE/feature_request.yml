name: Feature request
description: Propose a change or an addition
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/anilgehlotn/enterprise-agentic-rag/blob/main/DOCS/ROADMAP.md)
        and the open issues first — much of the planned work already has an issue to comment on.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard, missing or wrong today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to happen, and roughly how it would work.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - API (app/main.py, endpoints, streaming)
        - Agent (planner, retriever, grader, rewriter, responder, verifier)
        - Retrieval (Qdrant, BM25, RRF, FlashRank, citations)
        - Ingestion and chunking
        - Guardrails and safety
        - LLM gateway
        - Conversation memory / checkpointer
        - Analytics and feedback
        - MCP server
        - Streamlit UI
        - Evaluations and benchmarks
        - CI, Docker or deployment
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How would it be verified
      description: |
        What would show that it works and that it helps — a test, a benchmark, a measured
        before-and-after. Numbers in this project come from a real run.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why this one is better.

  - type: checkboxes
    id: contributing
    attributes:
      label: Would you like to work on it?
      options:
        - label: I would like to open a pull request for this
